<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Доска объявлений</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Доска объявлений</h1>
  </header>

  <main class="container">
    <section class="card">
      <h2>Подать объявление</h2>
      <form id="ad-form" novalidate>
        <label>
          Заголовок
          <input type="text" name="title" id="title" maxlength="100" required>
        </label>
        <label>
          Описание
          <textarea name="description" id="description" rows="4" required></textarea>
        </label>
        <label>
          Цена
          <input type="number" name="price" id="price" min="0" step="0.01" required>
        </label>
        <label>
          Изображение
          <input type="file" name="image" id="image" accept="image/*" required>
        </label>
        <img id="preview" class="preview" alt="" hidden>
        <button type="submit" id="submit-btn">Отправить</button>
        <p id="form-status" class="status" role="status"></p>
      </form>
    </section>

    <section>
      <div class="list-header">
        <h2>Объявления <span id="total" class="muted"></span></h2>
        <button type="button" id="refresh-btn" class="secondary">Обновить</button>
      </div>
      <input type="search" id="search" class="search" placeholder="Поиск по заголовку и описанию" autocomplete="off">
      <p id="list-status" class="status" role="status"></p>
      <div id="ads" class="grid"></div>
      <div class="pager">
        <button type="button" id="prev-btn" class="secondary">Назад</button>
        <span id="page-info" class="muted"></span>
        <button type="button" id="next-btn" class="secondary">Вперёд</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
